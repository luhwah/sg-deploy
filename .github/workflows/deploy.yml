# The reusable SiteGround deploy — called by each app's own .github/workflows/deploy*.yml.
# Job-level policy lives HERE, once: the runner, the timeout, and the concurrency rule
# that stops two deploys of the same site extracting into one docroot at the same
# time. The deploy logic lives in ../../deploy.sh via the composite action at the
# repo root.
#
# Why this exists (2026-09-07): every SiteGround connection used to leave one
# developer machine — a shared Starlink CGNAT address that was firewall-blocked
# three times — and then one static jump host, rationed to 15 connections an hour.
# A deploy from a GitHub runner costs that ration nothing, arrives from a fresh
# address every run, and ships only what is PUSHED.
#
# A fresh address is also sometimes a blocked one, which is what the second job is
# for — see the comment above `retry`.
name: sg-deploy

on:
  workflow_call:
    inputs:
      dry_run:
        description: Print the plan, connect to nothing
        type: boolean
        default: false
      verify:
        description: One connection, nothing uploaded — the smoke test only
        type: boolean
        default: false
      skip_lint:
        description: Skip the server-side php -l sweep
        type: boolean
        default: false
      migrate:
        description: webavie — run pending schema migrations
        type: boolean
        default: false
      ensure_admin:
        description: webavie — make sure the platform admin account exists
        type: boolean
        default: false
      seed:
        description: webavie — seed a home page if the site is empty
        type: boolean
        default: false
      seed_all:
        description: webavie — seed the full starter set
        type: boolean
        default: false
      seed_refresh:
        description: webavie — rewrite existing pages from content/ (staging sites only)
        type: boolean
        default: false
      expect_digest:
        description: webavie — the engine digest computed on the laptop
        type: string
        default: ""
      dir:
        description: Directory holding deploy.json, relative to the checkout
        type: string
        default: "."
      app:
        description: Name for the archive and log heading (default — the repository name)
        type: string
        default: ""
      node:
        description: Node.js major to install before staging (an app whose stageScript runs a Vite build); empty = none
        type: string
        default: ""
    secrets:
      SG_SSH_KEY:
        description: Private half of the dedicated CI deploy key for this site's hosting account
        required: true
      SG_SSH_USER:
        description: u####-xxxx@ssh.<host>
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.dry_run && 'plan (dry run)' || inputs.verify && 'verify' || 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sg-deploy-${{ github.repository }}-${{ inputs.dir }}
      cancel-in-progress: false
    outputs:
      blocked: ${{ steps.ship.outputs.blocked }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0        # version.json is written from `git describe --tags`
          fetch-tags: true
      - if: inputs.node != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node }}
          cache: npm
          cache-dependency-path: ${{ inputs.dir }}/package-lock.json
      - id: ship
        uses: luhwah/sg-deploy@main
        with:
          ssh-key: ${{ secrets.SG_SSH_KEY }}
          ssh-user: ${{ secrets.SG_SSH_USER }}
          known-hosts: ${{ vars.SG_KNOWN_HOSTS }}
          dir: ${{ inputs.dir }}
          app: ${{ inputs.app }}
          dry-run: ${{ inputs.dry_run }}
          verify: ${{ inputs.verify }}
          skip-lint: ${{ inputs.skip_lint }}
          migrate: ${{ inputs.migrate }}
          ensure-admin: ${{ inputs.ensure_admin }}
          seed: ${{ inputs.seed }}
          seed-all: ${{ inputs.seed_all }}
          seed-refresh: ${{ inputs.seed_refresh }}
          expect-digest: ${{ inputs.expect_digest }}
          soft-fail-on-block: true

  # ── The second address (2026-09-10) ─────────────────────────────────────────
  # SiteGround's firewall drops SSH from addresses it has blocked, and a runner draws
  # its address from a shared Azure pool where a stranger's failed logins are somebody
  # else's morning. There is no cure but a different address, and a job cannot change
  # its own — so the job above exits GREEN having deployed nothing, says so in an
  # annotation, and this one does the deploy from a runner that got a different draw.
  #
  # Only the TCP connect qualifies (dialed() in deploy.sh). A failed auth, a lint
  # error, a canary answering 200, a wrong engine digest: all of those fail the job
  # above outright and this one never starts, because none of them is a fluke.
  #
  # It exists to make a red run mean something. mindbodysolutions' deploy on
  # 2026-09-10 timed out from 172.214.155.115, worked from 4.154.142.179 sixty-three
  # seconds later, and mailed its owner "All jobs have failed" for a deploy that was
  # live — which is how a person learns to skim past the mails that matter.
  retry:
    name: ${{ inputs.verify && 'verify' || 'deploy' }} (second runner address)
    needs: deploy
    if: needs.deploy.outputs.blocked == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sg-deploy-${{ github.repository }}-${{ inputs.dir }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - if: inputs.node != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node }}
          cache: npm
          cache-dependency-path: ${{ inputs.dir }}/package-lock.json
      - uses: luhwah/sg-deploy@main
        with:
          ssh-key: ${{ secrets.SG_SSH_KEY }}
          ssh-user: ${{ secrets.SG_SSH_USER }}
          known-hosts: ${{ vars.SG_KNOWN_HOSTS }}
          dir: ${{ inputs.dir }}
          app: ${{ inputs.app }}
          dry-run: ${{ inputs.dry_run }}
          verify: ${{ inputs.verify }}
          skip-lint: ${{ inputs.skip_lint }}
          migrate: ${{ inputs.migrate }}
          ensure-admin: ${{ inputs.ensure_admin }}
          seed: ${{ inputs.seed }}
          seed-all: ${{ inputs.seed_all }}
          seed-refresh: ${{ inputs.seed_refresh }}
          expect-digest: ${{ inputs.expect_digest }}
          # No third draw: two blocked addresses in a row is a real event, and the
          # run going red for it is the point.
          soft-fail-on-block: false
